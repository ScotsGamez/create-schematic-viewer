name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: converter/uv.lock

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Type-check JavaScript modules
        run: npm run typecheck

      - name: Test JavaScript and HTTP behavior
        run: npm test

      - name: Synchronize locked Python environment
        run: uv sync --project converter --locked

      - name: Test converter
        run: uv run --project converter pytest

  container:
    name: Build and smoke-test container
    needs:
      - secrets
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build --tag create-schematic-viewer:ci .

      - name: Start hardened container
        run: >-
          docker run --detach --name schematic-viewer-ci
          --publish 127.0.0.1:4173:4173
          --read-only
          --tmpfs /app/.tmp:rw,noexec,nosuid,size=512m
          --tmpfs /data:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
          create-schematic-viewer:ci

      - name: Verify readiness and local browser dependencies
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/vendor/three/three.min.js >/dev/null

      - name: Report container logs
        if: always()
        run: docker logs schematic-viewer-ci

      - name: Remove container
        if: always()
        run: docker rm --force schematic-viewer-ci
