name: Publish release container

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify immutable image
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/scotsgamez/create-schematic-viewer
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate stable release tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable semantic version form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          package_version=$(node --print "require('./package.json').version")
          if [ "v$package_version" != "$RELEASE_TAG" ]; then
            echo "Release tag must match package.json version v$package_version" >&2
            exit 1
          fi
          if ! git rev-parse --verify origin/main >/dev/null; then
            echo "Full-history checkout did not provide origin/main" >&2
            exit 1
          fi
          released_commit=$(git rev-list --max-count=1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$released_commit" origin/main; then
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Scan tracked files and commit authors for PII
        run: npm run check:pii

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Sign published-image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Pull and smoke-test the published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          tools/smoke_container.sh "$image" schematic-viewer-release

      - name: Record immutable release coordinate
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf '### Published container\n\n`%s@%s`\n' \
            "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
