name: Feature request
description: Propose a focused improvement to Create Schematic Viewer.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and pull requests for this proposal.
          required: true
        - label: This request does not require distributing Minecraft, Create, mod, or resource-pack assets.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What alternatives have you considered, and what compatibility or security concerns apply?
